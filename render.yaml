# Optional Render Blueprint for the API. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: rsvr-auth-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: SESSION_COOKIE_NAME, value: rsvr_session }
      - { key: SESSION_TTL_HOURS, value: "24" }
      - { key: OTP_TTL_SECONDS, value: "300" }
      - { key: OTP_MAX_ATTEMPTS, value: "5" }
      - { key: OTP_RESEND_COOLDOWN_SECONDS, value: "60" }
      - { key: OTP_HOURLY_LIMIT, value: "5" }
      - { key: WEBAUTHN_RP_NAME, value: RSVR Secure Authentication }
      - { key: MONGODB_URI, sync: false }
      - { key: FRONTEND_ORIGIN, sync: false }
      - { key: SESSION_TOKEN_PEPPER, sync: false }
      - { key: OTP_HASH_SECRET, sync: false }
      - { key: EMAIL_USER, sync: false }
      - { key: EMAIL_PASS, sync: false }
      - { key: EMAIL_FROM, sync: false }
      - { key: WEBAUTHN_RP_ID, sync: false }
      - { key: WEBAUTHN_ORIGIN, sync: false }
